name: Actualizar datos de Steam y publicar

on:
  schedule:
    - cron: "0 9 * * *"   # todos los días a las 09:00 UTC
  workflow_dispatch:        # botón "Run workflow" manual
  push:
    branches: [main]        # publica también cuando cambias la web o config.json

permissions:
  contents: write   # para hacer commit de data.json
  pages: write      # para desplegar en GitHub Pages
  id-token: write

concurrency:
  group: steam-backlog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar data.json
        # En un push solo se publica la web; la API se consulta en el cron y en el manual.
        if: github.event_name != 'push'
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
        run: python scripts/update_steam.py

      - name: Commit de data.json
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Actualizar data.json"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
